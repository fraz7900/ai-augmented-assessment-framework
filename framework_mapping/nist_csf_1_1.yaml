      access to authorized activities and transactions.
    practices:
    - id: PR.AC-1
      text: Identities and credentials are issued, managed, verified, revoked, and audited for authorized
        devices, users and processes
    - id: PR.AC-2
      text: Physical access to assets is managed and protected
    - id: PR.AC-3
      text: Remote access is managed
    - id: PR.AC-4
      text: Access permissions and authorizations are managed, incorporating the principles of least privilege
        and separation of duties
    - id: PR.AC-5
      text: Network integrity is protected (e.g., network segregation, network segmentation)
    - id: PR.AC-6
      text: Identities are proofed and bound to credentials and asserted in interactions
    - id: PR.AC-7
      text: Users, devices, and other assets are authenticated (e.g., single-factor, multi-factor) commensurate
        with the risk of the transaction (e.g., individuals’ security and privacy risks and other organizational
        risks)
  - number: 2
    title: Awareness and Training (PR.AT)
    purpose: The organization’s personnel and partners are provided cybersecurity awareness education
      and are trained to perform their cybersecurity-related duties and responsibilities consistent with
      related policies, procedures, and agreements.
    practices:
    - id: PR.AT-1
      text: All users are informed and trained
    - id: PR.AT-2
      text: Privileged users understand their roles and responsibilities
    - id: PR.AT-3
      text: Third-party stakeholders (e.g., suppliers, customers, partners) understand their roles and
        responsibilities
    - id: PR.AT-4
      text: Senior executives understand their roles and responsibilities
    - id: PR.AT-5
      text: Physical and cybersecurity personnel understand their roles and responsibilities
  - number: 3
    title: Data Security (PR.DS)
    purpose: Information and records (data) are managed consistent with the organization’s risk strategy
      to protect the confidentiality, integrity, and availability of information.
    practices:
    - id: PR.DS-1
      text: Data-at-rest is protected
    - id: PR.DS-2
      text: Data-in-transit is protected
    - id: PR.DS-3
      text: Assets are formally managed throughout removal, transfers, and disposition
    - id: PR.DS-4
      text: Adequate capacity to ensure availability is maintained
    - id: PR.DS-5
      text: Protections against data leaks are implemented
    - id: PR.DS-6
      text: Integrity checking mechanisms are used to verify software, firmware, and information integrity
    - id: PR.DS-7
      text: The development and testing environment(s) are separate from the production environment
    - id: PR.DS-8
      text: Integrity checking mechanisms are used to verify hardware integrity
  - number: 4
    title: Information Protection Processes and Procedures (PR.IP)
    purpose: Security policies (that address purpose, scope, roles, responsibilities, management commitment,
      and coordination among organizational entities), processes, and procedures are maintained and used
      to manage protection of information systems and assets.
    practices:
    - id: PR.IP-1
      text: A baseline configuration of information technology/industrial control systems is created and
        maintained incorporating security principles (e.g. concept of least functionality)
    - id: PR.IP-2
      text: A System Development Life Cycle to manage systems is implemented
    - id: PR.IP-3
      text: Configuration change control processes are in place
    - id: PR.IP-4
      text: Backups of information are conducted, maintained, and tested
    - id: PR.IP-5
      text: Policy and regulations regarding the physical operating environment for organizational assets
