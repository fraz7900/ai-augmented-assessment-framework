- short_code: PR
  full_name: Protect
  purpose: Develop and implement appropriate safeguards to ensure delivery of critical services.
  practices_populated: true
  objectives:
  - number: 1
    title: Identity Management, Authentication and Access Control (PR.AC)
    purpose: Access to physical and logical assets and associated facilities is limited to authorized
