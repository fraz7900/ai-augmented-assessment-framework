    - id: PR.IP-6
      text: Data is destroyed according to policy
    - id: PR.IP-7
      text: Protection processes are improved
    - id: PR.IP-8
      text: Effectiveness of protection technologies is shared
    - id: PR.IP-9
      text: Response plans (Incident Response and Business Continuity) and recovery plans (Incident Recovery
