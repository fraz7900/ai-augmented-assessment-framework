# Backend dependency lock (ADR-0075). GENERATED -- do not hand-edit.
#
# R-9 has been open since Sprint 1: the development environment is not
# reproducible. pyproject.toml declares floors (">=") with no upper
# bounds and no resolution, so `pip install -e ".[dev]"` today and in
# six months produce different environments -- and CI installed the same
# unpinned way, meaning a transitive release could break the build with
# no code change and nothing would record what had actually been running.
#
# This file is the resolved set that the test counts in AGENTS.md and
# every measurement in docs/adr/ were produced against.
#
# Regenerate deliberately, never incidentally:
#     cd backend && source .venv/bin/activate
#     pip install -e ".[dev]" --upgrade && ./../scripts/lock-backend.sh
#
# Platform note: resolved on Linux/CPython 3.12. Wheels for another
# platform may differ; this project's supported target is the Docker
# image and Linux/WSL development (deployment/backend.Dockerfile).
