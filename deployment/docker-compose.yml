# Run from this directory: `docker compose up` (backend + frontend only).
# Ollama is intentionally NOT part of the default stack - see the `ollama`
# service below and ADR-0017.
#
# ADR-0045 (single-user/small-team deployment hardening): the backend is
# deliberately NOT published on a host port anymore. nginx (the frontend
# container) is the one gated entry point for both the UI and the API
# (proxied under /api/, see frontend.nginx.conf) - reaching the backend
# directly, bypassing that gate, is no longer possible from outside the
# Compose network. Before you run `docker compose up`, generate
# secrets/.htpasswd - see README.md; nginx will fail to start without it,
# which is the correct fail-closed behavior for a missing credentials file.
services:
  backend:
    build:
      context: ..
      dockerfile: deployment/backend.Dockerfile
    volumes:
      - compliance-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: deployment/frontend.Dockerfile
      # VITE_API_BASE_URL defaults to /api (see frontend.Dockerfile) -
      # same-origin, proxied by nginx to the backend service internally.
    ports:
      # nginx listens on 80 internally; published on 5173 as the one
      # host-reachable port for the whole stack (UI + proxied API).
      - "5173:80"
    volumes:
      - ./secrets/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      backend:
        condition: service_healthy

  # Not started by a plain `docker compose up`. Run explicitly with
  # `docker compose --profile ollama up` if you want to experiment with the
  # generative extraction path ADR-0011/ADR-0014 evaluated and deliberately
  # did not take by default - nothing in the running application calls this
  # service automatically; it exists as an available option, not a
  # dependency.
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  compliance-data:
  ollama-models:
