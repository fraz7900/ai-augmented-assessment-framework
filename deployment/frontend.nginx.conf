# react-router uses client-side routing - a direct browser visit (or
# refresh) on e.g. /assessments/<id>/evidence has no matching file on disk,
# so it must fall back to index.html and let the client-side router resolve
# it, rather than nginx returning a 404.
#
# ADR-0045 (single-user/small-team deployment hardening): this is now the
# ONE gated entry point for the whole stack, not just the static frontend.
# The backend is no longer published on a host port at all (see
# docker-compose.yml) -- /api/ here is the only way to reach it from
# outside the Compose network. Both locations share the same basic-auth
# gate, and because the browser now only ever talks to this one origin,
# the backend's CORS allowlist is never exercised for this deployment path
# at all (same-origin requests aren't subject to CORS).
#
# /etc/nginx/.htpasswd is NOT baked into the image or committed to the
# repo -- see deployment/README.md for how to generate one. A deployment
# without that file mounted will fail to start (nginx refuses to boot with
# auth_basic_user_file pointing at a missing file), which is the correct
# fail-closed behavior for a credentials file, not a bug to work around.
#
# ADR-0047 (TLS): plain HTTP (port 80) is gone entirely -- this is the only
# server block, listening on 443 with a cert/key mounted from
# secrets/tls.{crt,key} (see README.md for how to generate one; same
# fail-closed-on-missing-file behavior as .htpasswd above, since nginx
# won't boot without a valid ssl_certificate). Deliberately no separate
# port-80-redirect-to-443 server block/published port -- see ADR-0047's
# Alternatives for why that was judged not worth the added surface for a
# single-user/small-team deployment that publishes exactly one host port.
server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "Compliance platform (restricted)";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # MUST stay >= Settings.max_upload_bytes (core/config.py, 25MB).
    # nginx defaults to 1m when this is unset, and it enforces that limit
    # BEFORE proxying -- so without this line the application's own 25MB
    # limit is unreachable and every upload over 1MB dies at the proxy
    # with a bare "413 Request Entity Too Large" that names no size and
    # never reaches any application log. Found by uploading a real
    # 1.5MB standards PDF; every synthetic sample in this repo is under
    # 50KB, which is exactly why it went unnoticed.
    # backend/tests/test_deployment_config.py asserts the two agree.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ingestion is synchronous: POST /ingest parses, chunks, and
        # embeds the whole document before responding. nginx's 60s
        # default proxy_read_timeout is well under what a real document
        # takes, and the failure is a 504 the application never sees --
        # it keeps working and completes, but the response has nowhere
        # to go, so the user is told "gateway timeout" about an upload
        # that in fact succeeded.
        #
        # Measured on a real 59-page standards PDF (1.5MB): 17s to
        # parse, ~76s to embed 107 chunks, ~93s total with the model
        # cache warm. Embedding dominates and scales with chunk count at
        # roughly 0.7s per chunk.
        #
        # 300s therefore covers roughly 400 chunks, or a document of
        # about 200 pages. A document materially larger than that will
        # still time out here, and the fix for that is background
        # ingestion with a job-status endpoint, not a bigger number --
        # disclosed rather than papered over.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
